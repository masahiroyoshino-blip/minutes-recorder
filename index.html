<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>議事録アプリ 録音窓</title>
<style>
  :root { --ink:#1f2328; --sub:#57606a; --line:#d0d7de; --bg:#f6f8fa; --ok:#1a7f37; --ng:#cf222e; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color:var(--ink); background:#fff; font-size:15px; line-height:1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .note { color: var(--sub); font-size: 13px; }
  section { border:1px solid var(--line); border-radius: 10px; padding: 12px; margin: 12px 0; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; margin: 4px 6px 4px 0; min-height: 44px; }
  button.primary { background: var(--accent); color:#fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  select { font: inherit; padding: 8px; border:1px solid var(--line); border-radius: 8px; width: 100%; }
  label { display:block; margin: 6px 0 4px; font-weight: 600; font-size: 14px; }
  .meter { height: 12px; background: var(--bg); border:1px solid var(--line); border-radius: 6px; overflow:hidden; margin: 6px 0; }
  .meter > i { display:block; height:100%; width:0; background: var(--ok); transition: width .1s; }
  .box { background: var(--bg); border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-word; font-size: 14px; max-height: 220px; overflow:auto; }
  #status { font-weight: 600; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  #capFinal span { display:block; } #capInterim { color: var(--sub); }
</style>
</head>
<body>
<main>
  <h1>議事録アプリ 録音窓</h1>
  <p class="note">この窓で録音し、音声は区切りごとに元のアプリ画面へ渡します。<strong>録音中はこの窓を閉じないでください。</strong>
  音声や議事録はこのページには残りません。</p>
  <p id="status">接続を確認しています…</p>

  <section>
    <label for="source">音の取り方</label>
    <select id="source"><option value="mic">マイクのみ</option><option value="mix">マイク＋Web会議の音声（PC版Chrome）</option></select>
    <button id="btnStart" class="primary" disabled>録音開始</button><button id="btnStop" disabled>終了</button>
    <span id="clock" class="note"></span>
    <div class="meter"><i id="meter"></i></div>
    <p class="note" id="segInfo"></p>
  </section>

  <section>
    <label>リアルタイム字幕（速報）</label>
    <div class="box" id="capBox"><div id="capFinal"></div><div id="capInterim"></div></div>
    <p class="note" id="capStat"></p>
  </section>

  <section>
    <label>この窓の記録</label>
    <div class="box" id="log"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // 受け渡し相手として認める元画面：GASのウェブアプリ画面（Googleが用意する枠）だけ
  var PARENT_ORIGIN_RE = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var parentOrigin = null;
  var opts = { segMin: 1, lang: 'ja', captions: true };

  function localLog(text, ok) {
    var d = document.createElement('div');
    d.textContent = new Date().toLocaleTimeString('ja-JP') + '  ' + text;
    if (ok === false) d.className = 'ng';
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
  }
  function send(msg, transfer) {
    if (!parentOrigin || !window.opener) { localLog('元の画面に送れません（元の画面が閉じられた可能性）', false); return false; }
    window.opener.postMessage(msg, parentOrigin, transfer || []);
    return true;
  }
  function report(test, ok, detail) {
    localLog(test + '：' + (ok === true ? 'OK' : ok === false ? 'NG' : '') + ' ' + detail, ok);
    send({ type: 'log', test: test, ok: ok, detail: detail });
  }
  function errText(e) { return (e && (e.name ? e.name + ': ' : '') + (e.message || e)) || String(e); }

  // ------------------------------------------------ 元画面との接続
  window.addEventListener('message', function (e) {
    if (!PARENT_ORIGIN_RE.test(e.origin) || e.source !== window.opener) return; // 知らない相手からの連絡は無視
    var m = e.data || {};
    if (m.type === 'hello') {
      parentOrigin = e.origin;
      opts.segMin = Number(m.segMin) || 1;
      opts.lang = m.lang === 'en' ? 'en' : 'ja';
      opts.captions = m.captions !== false;
      $('status').textContent = '元のアプリ画面と接続しました（区切り ' + opts.segMin + '分）';
      $('status').className = 'ok';
      $('btnStart').disabled = false;
      report('窓 接続', true, '区切り' + opts.segMin + '分、言語' + opts.lang + '、環境 ' + JSON.stringify(envInfo()));
    } else if (m.type === 'stop') {
      stopRec();
    }
  });

  function envInfo() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var mimes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    return {
      mic: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
      display: !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia),
      rec: window.MediaRecorder ? mimes.filter(function (x) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x); }) : [],
      speech: !!SR,
      wakeLock: 'wakeLock' in navigator
    };
  }

  if (!window.opener) {
    $('status').textContent = 'この窓は、議事録アプリの画面の「録音窓を開く」ボタンから開いてください。';
    $('status').className = 'ng';
  } else {
    // 元画面に「準備できた」とだけ知らせる（中身は送らない）。返事の hello で相手を確かめる
    window.opener.postMessage({ type: 'ready' }, '*');
  }

  // ------------------------------------------------ 音量メーター
  var meterStop = null;
  function attachMeter(stream) {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var src = ctx.createMediaStreamSource(stream);
    var an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
    var data = new Uint8Array(an.fftSize), alive = true, peak = 0;
    (function tick() {
      if (!alive) { $('meter').style.width = '0'; return; }
      an.getByteTimeDomainData(data);
      var sum = 0; for (var i = 0; i < data.length; i++) { var v = (data[i] - 128) / 128; sum += v * v; }
      var level = Math.min(1, Math.sqrt(sum / data.length) * 4);
      peak = Math.max(peak, level);
      $('meter').style.width = Math.round(level * 100) + '%';
      requestAnimationFrame(tick);
    })();
    return function () { alive = false; ctx.close(); return peak; };
  }

  // ------------------------------------------------ 字幕
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var cap = null;
  function startCaption() {
    if (!SR || !opts.captions) return;
    cap = { sr: new SR(), on: true, restarts: 0, finals: 0, errors: [], started: Date.now() };
    var sr = cap.sr;
    sr.lang = opts.lang === 'en' ? 'en-US' : 'ja-JP';
    sr.continuous = true; sr.interimResults = true;
    sr.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          var s = document.createElement('span'); s.textContent = t; $('capFinal').appendChild(s); cap.finals++;
          send({ type: 'caption', text: t });
        } else interim += t;
      }
      $('capInterim').textContent = interim;
      $('capBox').scrollTop = $('capBox').scrollHeight;
    };
    sr.onerror = function (e) { cap.errors.push(e.error); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') cap.on = false; };
    sr.onend = function () { if (cap && cap.on) { cap.restarts++; setTimeout(function () { if (cap && cap.on) { try { sr.start(); } catch (err) {} } }, 300); } };
    try { sr.start(); } catch (e) { report('窓 字幕', false, errText(e)); }
  }
  function stopCaption() {
    if (!cap) return;
    cap.on = false; try { cap.sr.stop(); } catch (e) {}
    var sec = Math.round((Date.now() - cap.started) / 1000);
    report('窓 字幕', cap.finals > 0, sec + '秒動作、確定 ' + cap.finals + '件、自動再開 ' + cap.restarts + '回' + (cap.errors.length ? '、エラー ' + cap.errors.join('/') : ''));
    cap = null;
  }

  // ------------------------------------------------ 録音
  var rec = null, wakeLock = null;
  function pickMime() {
    var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    for (var i = 0; i < c.length; i++) { if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return '';
  }
  function stopAll(list) { list.forEach(function (s) { if (s.getTracks) s.getTracks().forEach(function (t) { t.stop(); }); else if (s.close) s.close(); }); }

  $('btnStart').onclick = function () {
    var source = $('source').value, extra = [];
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (mic) {
      extra.push(mic);
      report('窓 マイク', true, '取得できた（' + ((mic.getAudioTracks()[0] || {}).label || '名称なし') + '）');
      if (source !== 'mix') return mic;
      return navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }).then(function (disp) {
        extra.push(disp);
        if (!disp.getAudioTracks().length) throw new Error('タブの音声が共有されていません（共有画面で「タブの音声も共有する」をオンに）');
        report('窓 タブ音声', true, '共有できた（' + disp.getAudioTracks()[0].label + '）');
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var dest = ctx.createMediaStreamDestination();
        ctx.createMediaStreamSource(mic).connect(dest);
        ctx.createMediaStreamSource(new MediaStream(disp.getAudioTracks())).connect(dest);
        extra.push({ close: function () { ctx.close(); } });
        return dest.stream;
      });
    }).then(function (stream) {
      rec = { stream: stream, extra: extra, mime: pickMime(), seg: 0, startedAt: Date.now(), segStart: 0, recorder: null, sent: 0 };
      meterStop = attachMeter(stream);
      startSegment();
      rec.timer = setInterval(function () {
        var el = Math.round((Date.now() - rec.startedAt) / 1000);
        $('clock').textContent = '録音中 ' + Math.floor(el / 60) + '分' + (el % 60) + '秒';
        if (Date.now() - rec.segStart >= opts.segMin * 60000) rotateSegment();
      }, 1000);
      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () {});
      $('capFinal').innerHTML = ''; startCaption();
      $('btnStart').disabled = true; $('btnStop').disabled = false; $('source').disabled = true;
      send({ type: 'started', source: source, mime: rec.mime });
      report('窓 録音開始', true, (source === 'mix' ? 'マイク＋タブ' : 'マイクのみ') + '、形式 ' + (rec.mime || '既定'));
    }).catch(function (e) {
      stopAll(extra);
      report('窓 録音開始', false, errText(e));
    });
  };

  function startSegment() {
    var idx = rec.seg, offsetSec = Math.round((Date.now() - rec.startedAt) / 1000), chunks = [];
    var r = rec.mime ? new MediaRecorder(rec.stream, { mimeType: rec.mime, audioBitsPerSecond: 32000 }) : new MediaRecorder(rec.stream);
    r.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    r.onstop = function () {
      var type = r.mimeType || rec.mime || 'audio/webm';
      new Blob(chunks, { type: type }).arrayBuffer().then(function (buf) {
        var size = buf.byteLength;
        // 音声データは受け渡し（transfer）で元画面へ移す。この窓には残さない
        if (send({ type: 'segment', idx: idx, offsetSec: offsetSec, mime: type, buf: buf }, [buf])) {
          $('segInfo').textContent = '区間' + (idx + 1) + 'を元の画面へ渡しました（' + (size / 1048576).toFixed(2) + 'MB）';
          localLog('区間' + (idx + 1) + ' 受け渡し ' + (size / 1048576).toFixed(2) + 'MB', true);
        }
      });
    };
    r.start(5000);
    rec.recorder = r; rec.segStart = Date.now();
  }
  function rotateSegment() { rec.recorder.stop(); rec.seg++; startSegment(); }

  function stopRec() {
    if (!rec) return;
    clearInterval(rec.timer);
    rec.recorder.stop();
    if (meterStop) meterStop();
    stopAll(rec.extra);
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
    stopCaption();
    report('窓 録音終了', true, '合計 ' + Math.round((Date.now() - rec.startedAt) / 1000) + '秒、' + (rec.seg + 1) + '区間');
    send({ type: 'stopped', segments: rec.seg + 1 });
    $('clock').textContent = '録音を終了しました。この窓は閉じて構いません。';
    $('btnStop').disabled = true; $('btnStart').disabled = false; $('source').disabled = false;
    rec = null;
  }
  $('btnStop').onclick = stopRec;

  window.addEventListener('beforeunload', function (e) { if (rec) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
